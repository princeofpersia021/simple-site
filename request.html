<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="request.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REQUEST</title>
</head>
<body>
     <header>
       <DIV>
        <nav class="nav">
        <h1 class="logo-name">PRINCE</h1>
         <a href="index.html">HOME</a>
         <a href="mywork.html">MY WORK</a>
         <a href="myservices.html">MY SERVICES</a>
         <a href="request.html">SEND REQUEST</a>
         <img class="logo" src="logo.png" alt="PRINCE LOGO">
        </nav>
        </header>
        <main>
            <section class="form">
              <h2>درخواست همکاری</h2>
              <form id="request_form">
                
                <label>نام و نام خانوادگی</label>
                <input type="text" name="name"
                placeholder="نام خود را وارد کنید" required>
                
                <label>ایمیل</label>
                <input type="email" name="email"
                placeholder="ایمیل خود را وارد کنید" required>
                
                <label>شماره تماس</label>
                <input type="tel" name="phone"
                placeholder="تلفن خود را وارد کنین">
                
                <label>نوع پروژه</label>
                <select name="project_type" required>
                    <option value="gaming">تدوین گیمینگ</option>
                    <option value="Adv">تبلیغاتی</option>
                    <option value="cinematic">سینمایی و بلند زمان</option>
                    <option value="site">سایت</option>
                    <option value="other">سایر</option>
                </select>
                
                <label>بودجه</label>
                <input type="text" name="budget"
                placeholder="بودجه ی خود را وارد کنید">
                
                <label>توضیحات</label>
                <textarea name="message"
                placeholder="توضیحات خود را وارد کنید" required>
              </textarea>
              <button type="submit">ارسال درخواست</button>
              </form>
            </section>
        </main>
  
  <div class="modal_overlay" 
       id="response_modal" hidden>
    <div class="model_box" 
         role="dialog" 
         aria-modal="true"
         aria-labelledby="modal_title">
         <div class="modal_icon" id="modal_icon">
          ✅
         </div>
      <h2 id="modal_title">پیام شما با موفقیت ارسال شد</h2>
      <p id="modal_message">از اینکه با ما در ارتباط هستین سپاس گزاریم
        به زودی با شما تماس خواهیم گرفت
      </p>
      <button type="button" id="modal_close">
        متوجه شدم
      </button>
    </div>
  </div>
   <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
            <script src="script.js"></script>
</body>
</html>
